<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon: the three connected computational nodes from the wordmark.
    Drawn at 32×32 with 4px node squares so it stays legible at 16px.
    An SVG icon scales to every density without shipping a PNG set.
  -->
  <rect width="32" height="32" fill="#050607"/>
  <g stroke="#4f72ff" stroke-width="1.2" stroke-opacity="0.55" fill="none">
    <path d="M16 8 24 24 8 24Z"/>
  </g>
  <g fill="#ece9e2">
    <rect x="13.6" y="5.6" width="4.8" height="4.8"/>
    <rect x="21.6" y="21.6" width="4.8" height="4.8"/>
    <rect x="5.6" y="21.6" width="4.8" height="4.8"/>
  </g>
  <rect x="14.6" y="14.4" width="2.8" height="2.8" fill="#ffb45c"/>
</svg>
